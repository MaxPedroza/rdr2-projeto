# Netlify Configuration for RDR2 Tracker PWA
[build]
  base = "rdr2-frontend"
  command = "npm run build"
  publish = "dist/rdr2-frontend"

# SPA Rewrite - Crucial for Angular routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"



