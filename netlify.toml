# Netlify Configuration for RDR2 Tracker PWA
# Esta configuração aponta para a pasta rdr2-frontend

[build]
  base = "rdr2-frontend"
  command = "npm run build"
  publish = "dist/rdr2-frontend"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=86400"
