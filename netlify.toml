# Netlify Configuration for RDR2 Tracker PWA

[build]
  base = "rdr2-frontend"
  command = "npm run build"
  publish = "dist/rdr2-frontend"

# SPA Rewrite - Importante para rotas Angular
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

