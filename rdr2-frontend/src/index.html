<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>RDR2 Tracker - Colecionáveis e Missões</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="description" content="Rastreador completo de colecionáveis, missões e desafios de Red Dead Redemption 2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RDR2 Tracker">
  
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>
<body>
  <app-root></app-root>
  
  <noscript>Por favor, ative JavaScript para usar esta aplicação.</noscript>
  
  <script>
    // Registrar Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/ngsw-worker.js').then(registration => {
        console.log('✅ Service Worker registrado:', registration);
      }).catch(err => {
        console.warn('⚠️ Erro ao registrar Service Worker:', err);
      });
    }
  </script>
</body>
</html>
